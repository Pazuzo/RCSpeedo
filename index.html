<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Speedometer</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:#010105;
    color:#d9faff;
    overflow-x:hidden;
}

/* КИБЕР ГРИД */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,229,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.06) 1px, transparent 1px);
    background-size:48px 48px;
    z-index:-2;
}

.container{max-width:1150px;margin:auto;padding:1.5rem}

/* HERO */
.hero{
    text-align:center;
    padding:3rem 1rem 2rem;
}

.hero h1{
    font-size:3.5rem;
    font-weight:900;
    letter-spacing:-1px;
    background:linear-gradient(135deg, #00e5ff, #a020f0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 20px #0af2;
}

.hero p{
    margin-top:0.8rem;
    color:#8aa;
    font-size:1rem;
    letter-spacing:1px;
}

/* MOCKUP */
.mockup{
    margin:2.5rem auto 0;
    width:280px;height:540px;
    border-radius:2.2rem;
    background:#03050b;
    border:1px solid #0af3;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 40px #0af2, inset 0 0 20px #0af1;
}

/* СВЕТЛИНЕНА АНИМАЦИЯ */
.mockup::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,#0af2,transparent);
    animation:scan 2.8s linear infinite;
    pointer-events:none;
}

@keyframes scan{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(100%)}
}

/* HUD КОНТЕЙНЕР */
.hud{
    position:absolute;
    inset:0;
    padding:1rem;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    font-family:'Share Tech Mono', monospace;
    z-index:2;
}

/* Горен статус */
.hud-top{
    display:flex;
    justify-content:space-between;
    font-size:0.75rem;
    font-weight:bold;
    border-bottom:1px solid #0af3;
    padding-bottom:0.5rem;
}

.hud-top span:first-child{color:#0af; text-shadow:0 0 3px #0af;}
.hud-top span:last-child{animation:pulse 1.2s infinite;}

@keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:0.4}
}

/* ГЛАВЕНА СКОРОСТ */
.hud-center{
    text-align:center;
    margin:2rem 0;
}

.hud-center .big-speed{
    font-size:3.3rem;
    font-weight:900;
    line-height:1;
    text-shadow:0 0 10px #0af,0 0 20px #0af;
    letter-spacing:2px;
}

.hud-center .units{
    font-size:1rem;
    color:#8af;
}

/* Долен статус */
.hud-bottom{
    font-size:0.7rem;
    display:flex;
    justify-content:space-between;
    border-top:1px solid #0af3;
    padding-top:0.5rem;
}

/* СТРАНИЧНИ ТЕКСТОВЕ */
.hud-side{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:0.7rem;
    line-height:1.6;
    opacity:0.7;
}

.hud-left{left:8px; text-align:left;}
.hud-right{right:8px; text-align:right;}

/* БАРОВЕ ГРАФИКА */
.hud-bars{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
}

.hud-bars span{
    width:6px;
    height:6px;
    background:#0af;
    border-radius:2px;
    animation:blink 1s infinite alternate;
}

.hud-bars span:nth-child(2){animation-delay:0.2s}
.hud-bars span:nth-child(3){animation-delay:0.4s}
.hud-bars span:nth-child(4){animation-delay:0.6s}

@keyframes blink{
    0%{opacity:0.2}
    100%{opacity:1}
}

/* БУТОНИ */
.screen-buttons{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:0.8rem;
}

.screen-buttons a{
    font-size:0.75rem;
    padding:0.5rem 1.1rem;
    border-radius:40px;
    backdrop-filter:blur(4px);
    transition:0.2s;
    font-weight:600;
    text-decoration:none;
}

.btn-primary{
    background:#0af;
    color:#000;
    box-shadow:0 0 12px #0af;
}
.btn-primary:hover{
    transform:scale(1.05);
    background:#2cf;
}

.btn-secondary{
    border:1px solid #0af;
    color:#0af;
}
.btn-secondary:hover{
    background:#0af1;
    box-shadow:0 0 20px #0af;
}

/* КАРТИ */
.features{
    margin-top:5rem;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:1rem;
}

.card{
    background:#0af1;
    backdrop-filter:blur(8px);
    padding:0.8rem 1.8rem;
    border-radius:60px;
    font-weight:bold;
    font-size:0.9rem;
    border:1px solid #0af3;
}

/* ХАРДУЕР */
.hardware{
    margin-top:4rem;
    text-align:center;
}

.hardware-grid{
    display:flex;
    gap:1rem;
    justify-content:center;
    flex-wrap:wrap;
}

.hardware-item{
    background:#0af1;
    padding:0.5rem 1.5rem;
    border-radius:40px;
    font-size:0.85rem;
}

/* ФУТЪР */
.footer{
    margin-top:5rem;
    text-align:center;
    font-size:0.75rem;
    opacity:0.5;
}
</style>
</head>

<body>
<div class="container">

<section class="hero">
<h1>RC SPEEDOMETER</h1>
<p>next‑gen telemetry for adrenaline</p>

<div class="mockup">
    <div class="hud">
        <div class="hud-top">
            <span>🛰️ GPS FIX</span>
            <span id="trackingLabel">🔴 LIVE</span>
        </div>

        <div class="hud-center">
            <div class="big-speed" id="speedValue">0</div>
            <div class="units">km/h</div>
        </div>

        <div class="hud-bottom">
            <span>📡 SAT: 07</span>
            <span>⚡ MAX: 0</span>
        </div>
    </div>

    <div class="hud-side hud-left">
        SPD<br>
        AVG<br>
        G-FORCE
    </div>

    <div class="hud-side hud-right">
        LOCK<br>
        RANGE<br>
        MODE
    </div>

    <div class="hud-bars">
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="screen-buttons">
        <a href="RCSpeedo.apk" class="btn-primary">⬇️ APK</a>
        <a href="https://github.com/Pazuzo/RCSpeedo" class="btn-secondary">🖥️ CODE</a>
    </div>
</div>
</section>

<!-- ФУНКЦИОНАЛНОСТИ -->
<section class="features">
<div class="card">🛰️ REAL GPS</div>
<div class="card">⚡ 0‑60 / 0‑100</div>
<div class="card">📈 LIVE GRAPH</div>
<div class="card">🎮 REC MODE</div>
</section>

<section class="hardware">
<div class="hardware-grid">
<div class="hardware-item">✅ XIAO ESP32‑S3</div>
<div class="hardware-item">✅ Flyfish M10 GPS</div>
<div class="hardware-item">✅ WebSocket</div>
</div>
</section>

<div class="footer">
CYBERPUNK TELEMETRY • FULLY OPEN SOURCE
</div>

</div>

<script>
let speedElement = document.getElementById('speedValue');
let trackingLabel = document.getElementById('trackingLabel');

let fakeSpeed = 0;
let direction = 1;

setInterval(() => {
    fakeSpeed += direction * (Math.random() * 6 + 2);
    if (fakeSpeed > 117) direction = -1;
    if (fakeSpeed < 12) direction = 1;

    let displaySpeed = Math.floor(fakeSpeed);
    speedElement.innerText = displaySpeed;

    // добавяме максимална стойност (demo)
    let maxSpan = document.querySelector('.hud-bottom span:last-child');
    if (displaySpeed > parseInt(maxSpan.innerText.split(':')[1] || 0))
        maxSpan.innerText = `🏁 MAX: ${displaySpeed}`;
}, 130);

// Мигащ "LIVE" индикатор
setInterval(() => {
    trackingLabel.style.opacity = (trackingLabel.style.opacity == '0.4') ? '1' : '0.4';
}, 800);
</script>

</body>
</html>
