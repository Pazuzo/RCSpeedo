<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RC Speedometer</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:#010105;
    color:#d9faff;
    overflow-x:hidden;
}

/* КИБЕР ГРИД */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,229,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.06) 1px, transparent 1px);
    background-size:48px 48px;
    z-index:-2;
}

.container{max-width:1200px;margin:0 auto;padding:1.5rem}

/* HERO */
.hero{
    text-align:center;
    padding:1rem 1rem 0rem;
}

.hero h1{
    font-size:clamp(2rem, 7vw, 3.2rem);
    font-weight:900;
    letter-spacing:-1px;
    background:linear-gradient(135deg, #00e5ff, #a020f0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 20px #0af2;
}

.hero p{
    margin-top:0.2rem;
    color:#8aa;
    font-size:clamp(0.75rem, 4vw, 0.9rem);
}

/* MOCKUP ТЕЛЕФОН */
.mockup{
    margin:1.2rem auto 0;
    width:min(80%, 280px);
    max-width:280px;
    aspect-ratio: 9 / 18;
    border-radius:2rem;
    background:#03050b;
    border:1px solid #0af3;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 30px #0af2, inset 0 0 15px #0af1;
}

/* СВЕТЛИНЕНА АНИМАЦИЯ */
.mockup::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,#0af2,transparent);
    animation:scan 2.8s linear infinite;
    pointer-events:none;
}

@keyframes scan{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(100%)}
}

/* HUD КОНТЕЙНЕР */
.hud{
    position:absolute;
    inset:0;
    padding:0.7rem;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    font-family:'Share Tech Mono', 'Courier New', monospace;
    z-index:2;
}

/* Горен статус */
.hud-top{
    display:flex;
    justify-content:space-between;
    font-size:0.65rem;
    font-weight:bold;
    border-bottom:1px solid #0af3;
    padding-bottom:0.3rem;
    margin-bottom:0rem;
}

.hud-top span:first-child{color:#0af; text-shadow:0 0 3px #0af;}
.hud-top span:last-child{animation:pulse 1.2s infinite;}

@keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:0.4}
}

/* ГЛАВЕНА СКОРОСТ */
.hud-center{
    text-align:center;
    margin:0rem 0;
}

.hud-center .big-speed{
    font-size:clamp(2.5rem, 8vw, 3.2rem);
    font-weight:900;
    line-height:1;
    text-shadow:0 0 8px #0af,0 0 16px #0af;
    letter-spacing:2px;
}

.hud-center .units{
    font-size:0.8rem;
    color:#8af;
}

/* Долен статус */
.hud-bottom{
    font-size:0.6rem;
    display:flex;
    justify-content:space-between;
    border-top:1px solid #0af3;
    padding-top:0.3rem;
    margin-bottom:0rem;
}

/* СТРАНИЧНИ ТЕКСТОВЕ */
.hud-side{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:0.55rem;
    line-height:1.5;
    opacity:0.7;
    font-weight:bold;
}

.hud-left{left:5px; text-align:left;}
.hud-right{right:5px; text-align:right;}

/* БАРОВЕ ГРАФИКА */
.hud-bars{
    position:absolute;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:3px;
}

.hud-bars span{
    width:4px;
    height:4px;
    background:#0af;
    border-radius:2px;
    animation:blink 1s infinite alternate;
}

.hud-bars span:nth-child(2){animation-delay:0.2s}
.hud-bars span:nth-child(3){animation-delay:0.4s}
.hud-bars span:nth-child(4){animation-delay:0.6s}

@keyframes blink{
    0%{opacity:0.2}
    100%{opacity:1}
}

/* БУТОНИТЕ – ПРЕМЕСТЕНИ ИЗВЪН MOCKUP */
.buttons-outside{
    display:flex;
    gap:1rem;
    justify-content:center;
    margin-top:1.5rem;
    margin-bottom:1.5rem;
}

.btn{
    font-size:0.9rem;
    padding:0.6rem 1.6rem;
    border-radius:60px;
    font-weight:bold;
    text-decoration:none;
    transition:0.2s;
    display:inline-block;
    text-align:center;
}

.btn-primary{
    background:#0af;
    color:#000;
    box-shadow:0 0 10px #0af;
}
.btn-primary:hover{
    transform:scale(1.02);
    background:#2cf;
    box-shadow:0 0 20px #0af;
}

.btn-secondary{
    border:1px solid #0af;
    color:#0af;
    background:rgba(0,170,255,0.05);
}
.btn-secondary:hover{
    background:#0af2;
    box-shadow:0 0 15px #0af;
}

/* КАРТИ */
.features{
    margin-top:2.5rem;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:0.7rem;
}

.card{
    background:#0af1;
    backdrop-filter:blur(4px);
    padding:0.4rem 1.2rem;
    border-radius:60px;
    font-weight:bold;
    font-size:0.8rem;
    border:1px solid #0af3;
}

/* ХАРДУЕР */
.hardware{
    margin-top:2.5rem;
    text-align:center;
}

.hardware-grid{
    display:flex;
    gap:0.7rem;
    justify-content:center;
    flex-wrap:wrap;
}

.hardware-item{
    background:#0af1;
    padding:0.3rem 1rem;
    border-radius:40px;
    font-size:0.75rem;
}

/* ФУТЪР */
.footer{
    margin-top:3rem;
    margin-bottom:1rem;
    text-align:center;
    font-size:0.65rem;
    opacity:0.5;
}

/* МЕДИЙНИ ЗАЯВКИ */
@media (max-width: 550px) {
    .container{padding:0.8rem;}
    .hero h1{font-size:1.8rem;}
    .card{font-size:0.7rem; padding:0.3rem 0.8rem;}
    .hardware-item{font-size:0.65rem;}
    .hud-side{font-size:0.45rem;}
    .hud-left{left:3px;}
    .hud-right{right:3px;}
    .btn{font-size:0.8rem; padding:0.4rem 1.2rem;}
}
</style>
</head>

<body>
<div class="container">

<section class="hero">
<h1>RC SPEEDOMETER</h1>
<p>next‑gen telemetry for adrenaline</p>

<div class="mockup">
    <div class="hud">
        <div class="hud-top">
            <span>🛰️ GPS FIX</span>
            <span id="trackingLabel">🔴 LIVE</span>
        </div>

        <div class="hud-center">
            <div class="big-speed" id="speedValue">0</div>
            <div class="units">km/h</div>
        </div>

        <div class="hud-bottom">
            <span id="satValue">🛸 SAT: 07</span>
            <span id="maxValue">🏁 MAX: 0</span>
        </div>
    </div>

    <div class="hud-side hud-left">
        SPD<br>AVG<br>G-FORCE
    </div>

    <div class="hud-side hud-right">
        LOCK<br>RANGE<br>MODE
    </div>

    <div class="hud-bars">
        <span></span><span></span><span></span><span></span>
    </div>
</div>

<!-- БУТОНИТЕ СА ТУК – ИЗВЪН mockup-а -->
<div class="buttons-outside">
    <a href="Android/app-debug.apk" class="btn btn-primary">⬇️ СВАЛИ APK</a>
    <a href="https://github.com/Pazuzo/RCSpeedo" class="btn btn-secondary" target="_blank">🖥️ GitHub</a>
</div>
</section>

<!-- ФУНКЦИОНАЛНОСТИ -->
<section class="features">
<div class="card">🛰️ REAL GPS</div>
<div class="card">⚡ 0‑60 / 0‑100</div>
<div class="card">📈 LIVE GRAPH</div>
<div class="card">🎮 REC MODE</div>
</section>

<section class="hardware">
<div class="hardware-grid">
<div class="hardware-item">✅ XIAO ESP32‑S3</div>
<div class="hardware-item">✅ Flyfish M10 GPS</div>
<div class="hardware-item">✅ WebSocket</div>
</div>
</section>

<div class="footer">
CYBERPUNK TELEMETRY • FULLY OPEN SOURCE
</div>

</div>

<script>
// --- ДЕМО СКРИПТ ЗА ВИЗУАЛИЗАЦИЯ ---
let speedElement = document.getElementById('speedValue');
let satElement = document.getElementById('satValue');
let maxElement = document.getElementById('maxValue');
let trackingLabel = document.getElementById('trackingLabel');

let currentSpeed = 0;
let direction = 1;
let currentMax = 0;

function updateHUD(speed, maxSpeed) {
    speedElement.innerText = Math.floor(speed);
    maxElement.innerText = `🏁 MAX: ${Math.floor(maxSpeed)}`;
    let sats = 7 + Math.floor(Math.random() * 3);
    satElement.innerText = `🛸 SAT: ${sats.toString().padStart(2, '0')}`;
}

setInterval(() => {
    let change = Math.random() * 8 + 3;
    currentSpeed += direction * change;
    
    if (currentSpeed > 118) {
        currentSpeed = 118;
        direction = -1;
    }
    if (currentSpeed < 15) {
        currentSpeed = 15;
        direction = 1;
    }
    
    if (currentSpeed > currentMax) {
        currentMax = currentSpeed;
    }
    
    updateHUD(currentSpeed, currentMax);
}, 130);

setInterval(() => {
    trackingLabel.style.opacity = (trackingLabel.style.opacity == '0.4') ? '1' : '0.4';
}, 800);
</script>

</body>
</html>
