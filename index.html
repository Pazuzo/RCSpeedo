<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RC Speedometer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #000;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* ТЕЛЕФОН */
.phone {
    width: 300px;
    height: 600px;
    border-radius: 36px;
    background: #05060c;
    border: 1px solid #00e5ff22;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    box-shadow: 0 0 0 3px #111, 0 0 0 5px #1a1a1a;
}

/* ГОРНА ЛЕНТА */
.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
}

/* ЛЕНТИ ЗА САТЕЛИТИ */
.bars {
    display: flex;
    gap: 3px;
    align-items: flex-end;
}
.bars span {
    width: 5px;
    border-radius: 2px;
    background: #00e5ff;
    transition: all 0.2s;
}

/* REC БУТОН */
.rec {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid #00e5ff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
    color: #00e5ff;
    background: transparent;
    transition: 0.2s;
}
.rec.recording {
    background: #ff3d00;
    border-color: #ff3d00;
    color: white;
    animation: recPulse 0.8s infinite alternate;
}
@keyframes recPulse {
    0% { opacity: 0.7; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
}

/* ЦЕНТЪР - СКОРОСТ */
.center {
    text-align: center;
    padding: 10px 0;
}
.speed {
    font-size: 96px;
    font-weight: 800;
    line-height: 1;
    transition: 0.2s;
}
.unit {
    color: #777;
    font-size: 14px;
    margin-top: -8px;
}

/* ДОЛЕН ПАНЕЛ С МЕТРИКИ */
.panel {
    margin: 12px;
    padding: 12px;
    border-radius: 20px;
    background: rgba(255,255,255,0.03);
    display: flex;
    justify-content: space-around;
    text-align: center;
}
.panel div {
    flex: 1;
}
.panel span {
    font-size: 11px;
    color: #888;
}
.panel strong {
    font-size: 20px;
    display: block;
    margin-top: 4px;
}

/* ГРАФИКА */
canvas {
    margin: 8px 12px;
    width: calc(100% - 24px);
    height: 110px;
    background: rgba(255,255,255,0.02);
    border-radius: 16px;
}

/* БУТОНИ */
.buttons {
    display: flex;
    gap: 10px;
    padding: 12px;
    margin-top: 4px;
    margin-bottom: 12px;
}
.buttons a {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: 0.2s;
}
.download {
    background: #00e5ff;
    color: #000;
}
.download:hover {
    box-shadow: 0 0 16px #00e5ff;
}
.github {
    border: 1px solid #00e5ff;
    color: #00e5ff;
    background: transparent;
}
.github:hover {
    background: #00e5ff22;
}

.reset-toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #00e5ff;
    color: #000;
    padding: 6px 20px;
    border-radius: 40px;
    font-size: 12px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
}
</style>
</head>

<body>
<div style="display: flex; flex-direction: column; align-items: center;">
    <div class="phone">
        <div class="top">
            <div class="bars" id="bars"></div>
            <div class="rec" id="recBtn">REC</div>
        </div>

        <div class="center">
            <div class="speed" id="speedDisplay">0.0</div>
            <div class="unit">km/h</div>
        </div>

        <div class="panel">
            <div><span>MAX</span><strong id="maxVal">0.0</strong></div>
            <div><span>0-60</span><strong id="t60Val">-</strong></div>
            <div><span>DIST</span><strong id="distVal">0.0</strong></div>
            <div><span>0-100</span><strong id="t100Val">-</strong></div>
        </div>

        <canvas id="speedCanvas" width="280" height="110"></canvas>

        <div class="buttons">
            <a href="Android/app-debug.apk" class="download">⬇️ APK</a>
            <a href="https://github.com/Pazuzo/RCSpeedo" class="github">GitHub</a>
        </div>
    </div>
    <div class="reset-toast" id="resetToast">⟳ RESET</div>
</div>

<script>
    // ---------- РЕАЛИСТИЧЕН АЛГОРИТЪМ ЗА СКОРОСТ ----------
    // Имитира ускорение/забавяне на RC кола
    let speed = 0;
    let throttle = 0;        // "газ" (0 до 1)
    let brake = 0;           // "спирачка" (0 до 1)
    let maxSpeedLimit = 0;   // текущо ограничение (за симулация)
    
    let maxSpeed = 0;
    let t60 = 0;
    let t100 = 0;
    let distance = 0;
    let sats = 7;
    let recording = false;
    let speedHistory = [];

    let raceStarted = false;
    let raceStartTime = 0;
    let done60 = false, done100 = false;

    // DOM елементи
    const speedDisplay = document.getElementById('speedDisplay');
    const maxValSpan = document.getElementById('maxVal');
    const distValSpan = document.getElementById('distVal');
    const t60Span = document.getElementById('t60Val');
    const t100Span = document.getElementById('t100Val');
    const recBtn = document.getElementById('recBtn');
    const resetToast = document.getElementById('resetToast');
    const barsDiv = document.getElementById('bars');
    const canvas = document.getElementById('speedCanvas');
    const ctx = canvas.getContext('2d');

    // ---------- ПОМОЩНИ ФУНКЦИИ ----------
    function getSpeedColor(s) {
        if (s < 30) return '#2196F3';
        if (s < 70) return '#00E5FF';
        if (s < 120) return '#9C27B0';
        return '#FF3D00';
    }

    function updateSatelliteUI() {
        let count = Math.min(5, Math.floor(sats / 2));
        let html = '';
        for (let i = 0; i < 5; i++) {
            let height = 6 + i * 4;
            let opacity = i < count ? 1 : 0.2;
            html += `<span style="height: ${height}px; opacity: ${opacity}; background: ${getSpeedColor(speed)};"></span>`;
        }
        barsDiv.innerHTML = html;
    }

    function drawGraph() {
        if (!ctx) return;
        const w = canvas.width = 280;
        const h = canvas.height = 110;
        ctx.clearRect(0, 0, w, h);
        if (speedHistory.length < 2) return;

        const maxSp = Math.max(...speedHistory, 5);
        const stepX = w / (speedHistory.length - 1);
        ctx.beginPath();
        for (let i = 0; i < speedHistory.length; i++) {
            let x = i * stepX;
            let y = h - (speedHistory[i] / maxSp) * h;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = getSpeedColor(speed);
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 5;
        ctx.shadowColor = getSpeedColor(speed);
        ctx.stroke();
        ctx.shadowBlur = 0;

        if (speedHistory.length) {
            let lastX = (speedHistory.length - 1) * stepX;
            let lastY = h - (speedHistory[speedHistory.length - 1] / maxSp) * h;
            ctx.beginPath();
            ctx.arc(lastX, lastY, 5, 0, Math.PI * 2);
            ctx.fillStyle = getSpeedColor(speed);
            ctx.fill();
        }
    }

    function refreshUI() {
        const color = getSpeedColor(speed);
        speedDisplay.style.color = color;
        speedDisplay.style.textShadow = `0 0 20px ${color}`;
        speedDisplay.innerText = speed.toFixed(1);
        maxValSpan.innerText = maxSpeed.toFixed(1);
        maxValSpan.style.color = color;
        distValSpan.innerText = distance.toFixed(1);
        t60Span.innerText = t60 > 0 ? t60.toFixed(2) : '-';
        t100Span.innerText = t100 > 0 ? t100.toFixed(2) : '-';
        updateSatelliteUI();
        drawGraph();
    }

    function resetMetrics() {
        maxSpeed = 0;
        t60 = 0;
        t100 = 0;
        distance = 0;
        raceStarted = false;
        done60 = false;
        done100 = false;
        raceStartTime = 0;
        speedHistory = [];
        refreshUI();
        resetToast.style.opacity = '1';
        setTimeout(() => { resetToast.style.opacity = '0'; }, 800);
    }

    function toggleRecording() {
        recording = !recording;
        if (recording) {
            recBtn.classList.add('recording');
            recBtn.innerText = '●';
        } else {
            recBtn.classList.remove('recording');
            recBtn.innerText = 'REC';
        }
    }

    // ---------- РЕАЛИСТИЧНА СИМУЛАЦИЯ НА ДВИЖЕНИЕ ----------
    let lastTimestamp = 0;
    function updateRealisticTelemetry(nowMs) {
        if (lastTimestamp === 0) {
            lastTimestamp = nowMs;
            return;
        }
        let dt = Math.min(0.1, (nowMs - lastTimestamp) / 1000);
        if (dt <= 0) return;
        lastTimestamp = nowMs;

        // Случайна промяна на газ/спирачка (имитира RC управление)
        if (Math.random() < 0.05) {
            throttle = Math.random() * 0.8 + 0.2;  // 0.2–1.0 газ
            brake = 0;
        }
        if (Math.random() < 0.03 && speed > 10) {
            brake = Math.random() * 0.5 + 0.3;    // 0.3–0.8 спирачка
            throttle = 0;
        }
        if (Math.random() < 0.02 && speed < 5) {
            throttle = 0.2 + Math.random() * 0.3;
            brake = 0;
        }

        // Проста физика: ускорението зависи от газ/спирачка
        let acceleration = throttle * 35 - brake * 25;
        speed += acceleration * dt;
        
        // Ограничения
        let currentMax = 70 + Math.random() * 60;  // между 70 и 130 км/ч
        if (speed < 0) speed = 0;
        if (speed > currentMax) speed = currentMax;

        // Лек шум (реалистично трептене)
        speed += (Math.random() - 0.5) * 1.5 * dt;
        if (speed < 0) speed = 0;

        // RACE логика (0-60, 0-100)
        if (!raceStarted && speed > 2) {
            raceStarted = true;
            raceStartTime = nowMs / 1000;
            done60 = false;
            done100 = false;
        }
        if (raceStarted) {
            let nowSec = nowMs / 1000;
            distance += (speed / 3.6) * dt;
            if (!done60 && speed >= 60) {
                t60 = nowSec - raceStartTime;
                done60 = true;
            }
            if (!done100 && speed >= 100) {
                t100 = nowSec - raceStartTime;
                done100 = true;
            }
            if (speed < 1 && distance > 0) {
                raceStarted = false;
            }
        }
        if (speed > maxSpeed) maxSpeed = speed;

        // Симулация на сателити
        let newSats = 5 + Math.floor(Math.random() * 7);
        sats = Math.min(12, newSats);

        // Запис в историята за графиката
        speedHistory.push(speed);
        if (speedHistory.length > 120) speedHistory.shift();

        refreshUI();
    }

    // Анимационен цикъл (60fps)
    let lastFrameTime = 0;
    function animateLoop(now) {
        requestAnimationFrame(animateLoop);
        if (now - lastFrameTime < 50) return;  // ~20Hz, достатъчно за UI
        lastFrameTime = now;
        updateRealisticTelemetry(now);
    }

    // ---------- RESET ПЛЪЗГАНЕ ----------
    let touchStartX = 0;
    document.body.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
    document.body.addEventListener('touchend', (e) => {
        let diff = e.changedTouches[0].clientX - touchStartX;
        if (diff > 80) resetMetrics();
        touchStartX = 0;
    });

    // За десктоп мишка
    let mouseStartX = 0;
    document.body.addEventListener('mousedown', (e) => { mouseStartX = e.clientX; });
    document.body.addEventListener('mouseup', (e) => {
        if (mouseStartX && (e.clientX - mouseStartX) > 80) resetMetrics();
        mouseStartX = 0;
    });

    // Старт
    recBtn.addEventListener('click', toggleRecording);
    requestAnimationFrame(animateLoop);
</script>
</body>
</html>
